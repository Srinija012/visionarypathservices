<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 540">
  <rect width="810" height="540" fill="#003399"/>
  <!-- 12 stars in circle -->
  <g fill="#ffcc00" transform="translate(405,270)">
    <g id="eu-star">
      <polygon points="0,-24 7,-7 24,-7 11,3 15,20 0,9 -15,20 -11,3 -24,-7 -7,-7"/>
    </g>
    <use href="#eu-star" y="-120"/>
    <use href="#eu-star" y="120"/>
    <use href="#eu-star" x="-120"/>
    <use href="#eu-star" x="120"/>
    <use href="#eu-star" transform="rotate(30) translate(0,-120)"/>
    <use href="#eu-star" transform="rotate(60) translate(0,-120)"/>
    <use href="#eu-star" transform="rotate(120) translate(0,-120)"/>
    <use href="#eu-star" transform="rotate(150) translate(0,-120)"/>
    <use href="#eu-star" transform="rotate(210) translate(0,-120)"/>
    <use href="#eu-star" transform="rotate(240) translate(0,-120)"/>
    <use href="#eu-star" transform="rotate(300) translate(0,-120)"/>
    <use href="#eu-star" transform="rotate(330) translate(0,-120)"/>
  </g>
</svg>
