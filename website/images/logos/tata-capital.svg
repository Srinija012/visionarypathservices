<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <g transform="translate(10, 10)">
    <!-- TATA Capital Typography with signature bar -->
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#005080" letter-spacing="1">TATA <tspan font-weight="600" fill="#0066b2">CAPITAL</tspan></text>
    <!-- Yellow accent line under TATA -->
    <rect x="1" y="24" width="56" height="4" rx="2" fill="#e5a823"/>
    <text x="66" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#718096" letter-spacing="0.5">FINANCIAL SERVICES</text>
  </g>
</svg>
