<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="vpsFlashGradFull" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="55%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#FF3800" />
    </linearGradient>
    <filter id="vpsGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#FF5A00" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Flash Mark Icon (Scaled & Positioned) -->
  <g transform="translate(4, 4) scale(0.46)" filter="url(#vpsGlowLight)">
    <path d="M 55 18 L 55 50 L 82 50 L 45 102 L 45 70 L 18 70 Z" 
          stroke="url(#vpsFlashGradFull)" 
          stroke-width="14.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(58, 0)">
    <!-- VISIONARY -->
    <text x="0" y="33" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="24" 
          font-weight="800" 
          letter-spacing="1.8" 
          fill="#0B1F33">VISIONARY</text>
    
    <!-- PATH SERVICES with accent divider rules -->
    <text x="0" y="49" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="3.2" 
          fill="#FF5A00">PATH SERVICES</text>
    <line x1="116" y1="45" x2="164" y2="45" stroke="#FF5A00" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>